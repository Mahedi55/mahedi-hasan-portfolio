services:
  - type: web
    name: mahedi-hasan-portfolio
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate && python manage.py seed_portfolio
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: mahedi-hasan-portfolio-db
          property: connectionString

databases:
  - name: mahedi-hasan-portfolio-db
    databaseName: portfolio
    user: portfolio
