services:
  - type: web
    name: mahedi-hasan-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_portfolio && python manage.py bootstrap_portfolio_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        sync: false
      - key: PORTFOLIO_ADMIN_USERNAME
        sync: false
      - key: PORTFOLIO_ADMIN_EMAIL
        sync: false
      - key: PORTFOLIO_ADMIN_PASSWORD
        sync: false
